apiVersion: agentstration.io/v1
kind: SourceVersion
metadata:
  name: packs
definition:
  version: "1"
  displayName: Agentstration Pack Registry
  description: Reusable Packs published for Agentstration.
  publisher:
    name: gbaudrit
    displayName: Gauthier Baudrit
    url: https://github.com/gbaudrit
  bindings:
    - name: git-distribution
      targetKind: sourceProvider
  channels:
    - name: stable
      compatibility:
        agentstration:
          minVersion: 0.2.0-alpha.1
      provider:
        binding: git-distribution
      configuration:
        optionSet: io.agentstration.git/source-channel
        version: 1.0.0
        schemaDigest: sha256:1d6b1c53300ea531209a60ad56f50de209d4ae06bfc5c350de2d84bfe6842bf5
        values:
          repository: https://github.com/gbaudrit/agentstration-registry-packs.git
          ref: refs/heads/main
  catalogs:
    - kind: PackCatalog
      path: catalogs/packs.yaml

