apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: say-hello
  tags:
    sample: say-hello
definition:
  displayName: Say hello
  description: A minimal Agent that greets the user.
  handler: prompt-agent
  instructions: |
    Greet the user warmly.
    When the user asks you to say hello, answer with a short friendly greeting.
    Keep every response concise.
  modelProfile:
    binding: hello-model
  runtimeProfile:
    binding: hello-runtime
  tools: []
  behaviors: []
  middleware: []
  contextProviders: []
  settings: {}

